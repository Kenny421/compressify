name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.1", "3.2", "3.3", "3.4"]

    steps:
      - uses: actions/checkout@v4
      - name: Select legacy dependency set on Ruby 3.1
        if: matrix.ruby == '3.1'
        run: echo 'BUNDLE_GEMFILE=gemfiles/ruby31.gemfile' >> "$GITHUB_ENV"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Install libvips
        run: sudo apt-get update && sudo apt-get install -y libvips
      - name: Run tests
        run: bundle exec rake test
